name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          if [ -f "guest-switcher.zip" ]; then
            unzip -o guest-switcher.zip -d .
          fi
          ls -la

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Guest Switcher APK
        uses: actions/upload-artifact@v4
        with:
          name: GuestSwitcher-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
